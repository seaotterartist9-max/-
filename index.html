 if(!current.行動){let a=compatibleActions(current.場所,current.距離);set('行動',pick(a))} else if(!locks['行動']&&enabled('行動')) current.行動=current.行動;
 set('衣装系統',pick(vals('衣装系統'))); if(!current.衣装)set('衣装',pick(vals('衣装'))); set('アクセサリー',pick(vals('アクセサリー'))); if(!current.小物)set('小物',pick(vals('小物'))); set('持ち物',pick(vals('持ち物')));
 if(!current.距離){let ds=current.行動?actionDistance(current.行動):vals('距離');set('距離',pick(ds))} if(!current.アングル)set('アングル',pick(vals('アングル'))); if(!current.向き)set('向き',pick(focusDirections(current.注目部位)));
 set('注目部位',current.注目部位||pick(vals('注目部位'))); if(!locks.向き&&enabled('向き'))current.向き=pick(focusDirections(current.注目部位));
 if(!locks.距離&&enabled('距離')){let ds=current.行動?actionDistance(current.行動):vals('距離'); current.距離=pick(ds)}
 if(!current.ポーズ)set('ポーズ',pick(vals('ポーズ'))); if(!current.テーマ)set('テーマ',pick(vals('テーマ'))); set('感情',pick(vals('感情'))); set('表情',pick(EXPR[current.性格]||vals('表情'))); set('非現実要素',fantasyMode?pick(vals('非現実要素')):(document.getElementById('mode').value==='現実系'?'なし':pick(vals('非現実要素'))));
 if(document.getElementById('axis').value==='人物'&&!locks['性格'])current.性格=pick(colorPersonality().length?colorPersonality():vals('性格'));
 if(document.getElementById('axis').value==='性格'&&can('性格')){current.性格=seed.性格||pick(vals('性格')); if(can('表情'))current.表情=pick(EXPR[current.性格]||vals('表情'))}
 if(document.getElementById('axis').value==='髪型'&&can('髪型'))current.髪型=seed.髪型||pick(vals('髪型'));
 if(document.getElementById('axis').value==='髪色'&&can('髪色'))current.髪色=seed.髪色||pick(HAIR);
 if(document.getElementById('axis').value==='瞳の色'&&can('瞳の色'))current.瞳の色=seed['瞳の色']||pick(EYES);
 if(can('性格')&&axis!=='性格'){let p=colorPersonality(); if(p.length)current.性格=pick(p)}
 // coherence: locked distance/action gets priority
 if(locks.距離&&!locks.行動&&enabled('行動')){let a=compatibleActions(current.場所,current.距離);current.行動=pick(a)}
 if(locks.行動&&!locks.距離&&enabled('距離'))current.距離=pick(actionDistance(current.行動));
 if(locks.注目部位&&!locks.向き&&enabled('向き'))current.向き=pick(focusDirections(current.注目部位));
 if(!locks.ポーズ&&enabled('ポーズ')){if(/手|顔|髪|本|スマホ/.test(current.行動||''))current.ポーズ=pick(['本を持つ','スマホを見る','髪を触る','頬に手を当てる','軽く身を乗り出す']); else current.ポーズ=pick(vals('ポーズ'))}
 render(); status('全体生成しました。主軸：'+axis)}
function regenGroup(group){const fields=CATS[group]; for(const f of fields){if(can(f)){if(f==='行動')current[f]=pick(compatibleActions(current.場所,current.距離)); else if(f==='表情')current[f]=pick(EXPR[current.性格]||vals(f)); else if(f==='向き')current[f]=pick(focusDirections(current.注目部位)); else if(f==='距離')current[f]=pick(current.行動?actionDistance(current.行動):vals(f)); else current[f]=pick(vals(f))}} if(group==='シーン'&&current.イベント&&E[current.イベント]){let d=E[current.イベント];if(can('季節'))current.季節=d.season;if(can('衣装'))current.衣装=pick(d.outfits);if(can('小物'))current.小物=pick(d.props);if(can('行動'))current.行動=pick(d.actions)} if(group==='キャラクター'&&can('性格'))current.性格=pick(colorPersonality().length?colorPersonality():vals('性格')); render();status(group+'を再生成しました。ロックは維持しています。')}
function regenItem(f){if(!can(f))return; if(f==='性格')current[f]=pick(colorPersonality().length?colorPersonality():vals(f)); else if(f==='表情')current[f]=pick(EXPR[current.性格]||vals(f)); else if(f==='行動')current[f]=pick(compatibleActions(current.場所,current.距離)); else if(f==='距離')current[f]=pick(actionDistance(current.行動)); else if(f==='向き')current[f]=pick(focusDirections(current.注目部位)); else if(f==='衣装'&&current.イベント&&E[current.イベント])current[f]=pick(E[current.イベント].outfits); else current[f]=pick(f==='髪色'?HAIR:f==='瞳の色'?EYES:vals(f)); if(f==='髪色'||f==='瞳の色'){if(can('性格'))current.性格=pick(colorPersonality().length?colorPersonality():vals('性格'));if(can('表情'))current.表情=pick(EXPR[current.性格]||vals('表情'))} render();status(f+'を再生成しました。')}
function render(){const root=document.getElementById('results');root.innerHTML='';for(const [group,fields] of GROUPS){let d=document.createElement('details');d.className='group';d.open=false;let sum=document.createElement('summary');sum.innerHTML='<span>'+group+'</span><span class="group-tools"><button class="iconbtn" onclick="event.preventDefault();regenGroup('+JSON.stringify(group)+')">🔄</button><span>⌄</span></span>';d.appendChild(sum);let body=document.createElement('div');body.className='group-body';for(const f of fields){let row=document.createElement('div');row.className='row '+(!enabled(f)?'off':'');let lk=!!locks[f];row.innerHTML='<div class="field">'+esc(f)+'</div><div class="value">'+esc(current[f]||'—')+'</div><button class="iconbtn '+(lk?'locked':'')+'" onclick="toggleLock('+JSON.stringify(f)+')">'+(lk?'🔒':'🔓')+'</button><button class="iconbtn" onclick="regenItem('+JSON.stringify(f)+')">🔄</button>';body.appendChild(row)}d.appendChild(body);root.appendChild(d)}}
function toggleLock(f){locks[f]=!locks[f];render();saveSettings();status((locks[f]?'🔒 ロック：':'🔓 解除：')+f)}function clearLocks(){for(const k in locks)delete locks[k];render();status('すべてのロックを解除しました')}
function status(s){document.getElementById('status').textContent=s}
function copyResult(){let t=GROUPS.map(([g,fs])=>g+'\n'+fs.map(f=>f+'：'+(current[f]||'')).join('\n')).join('\n\n');navigator.clipboard?.writeText(t);status('生成結果をコピーしました')}
function twist(){let f=pick(['小物','持ち物','非現実要素','アクセサリー','天候']);if(can(f))current[f]=pick(vals(f));render();status('💡 '+f+'にもう一捻り入れました')}
function mixOne(){let f=pick(['場所','衣装','小物','非現実要素','行動']);if(can(f))current[f]=pick(vals(f));render();status('🌀 '+f+'に異物を1個混ぜました')}
function beforeAfter(){if(can('シチュエーション'))current.シチュエーション=(current.シチュエーション||'')+' → その後の余韻を想像する';render();status('📖 前後の流れを考えやすい形にしました')}
function searchRelated(term){term=(term||document.getElementById('relInput').value).trim();let arr=uniq([...(R[term]||[]),...(customR[term]||[])]);let box=document.getElementById('relatedResults');box.innerHTML=arr.length?arr.map(x=>'<button class="chip" onclick="searchRelated('+JSON.stringify(x)+')">'+esc(x)+'</button>').join(''):'<span class="hint">関連ワードが見つかりませんでした。</span>';if(term)document.getElementById('relInput').value=term}
function addCustomRelated(){let parent=document.getElementById('relInput').value.trim(),word=document.getElementById('customWord').value.trim();if(!parent||!word)return status('親ワードと追加語を入力してください');customR[parent]=uniq([...(customR[parent]||[]),word]);localStorage.setItem('oekakiRelated',JSON.stringify(customR));searchRelated(parent);status('関連ワードを登録しました')}
function addCustomData(){let f=document.getElementById('customCat').value,w=document.getElementById('customData').value.trim();if(!w)return;custom[f]=uniq([...(custom[f]||[]),w]);localStorage.setItem('oekakiCustom',JSON.stringify(custom));document.getElementById('customData').value='';showCustom();status(f+'に「'+w+'」を登録しました')}
function showCustom(){let box=document.getElementById('customList');let a=[];for(const [k,v] of Object.entries(custom))for(const x of v)a.push('<span class="chip">'+esc(k)+'：'+esc(x)+'</span>');box.innerHTML=a.length?a.join(''):'<span class="hint">まだ登録はありません。</span>'}
function initToggles(){const box=document.getElementById('toggles');box.innerHTML=ALL.map(f=>'<label class="check"><input type="checkbox" data-toggle="'+esc(f)+'" checked onchange="saveSettings()">'+esc(f)+'</label>').join('');let s=JSON.parse(localStorage.getItem('oekakiSettings')||'{}');document.querySelectorAll('[data-toggle]').forEach(x=>{if(s[x.dataset.toggle]===false)x.checked=false})}
function saveSettings(){let s={};document.querySelectorAll('[data-toggle]').forEach(x=>s[x.dataset.toggle]=x.checked);localStorage.setItem('oekakiSettings',JSON.stringify(s))}
initToggles();showCustom();generateAll();
</script></body></html>
