<section class="panel"><div class="small">🎯 生成の主軸</div><div class="small" style="margin-top:4px">ロックとは別に「ここを中心に一枚の絵を組み立てる」起点を決めます。</div><div class="grid" style="margin-top:8px"><select id="axis"></select><select id="axisValue"></select></div></section>

<section class="panel"><details><summary>⚙️ 詳細設定</summary>
<div class="small">🔒 ロック＝固定　／　OFF＝生成しない</div><div id="checks" class="grid" style="margin-top:8px"></div>
<div class="field"><label>🎯 注目部位</label><select id="focus"></select></div>
<div class="field"><label>🧍 ポーズ</label><select id="pose"></select></div>
</details></section>

<section class="panel"><details><summary>🧍 身体パーツから生成</summary><div class="field"><label>部位・身体要素</label><select id="bodyCat"></select></div><button class="secondary" style="width:100%" onclick="bodyGen()">🧍 この部位を主軸に生成</button></details></section>
<section id="result"></section>
<button class="primary" onclick="generate()">🎲 アイデアを生成</button>
<div class="grid3"><button class="secondary" onclick="save()">♡ 保存</button><button class="secondary" onclick="copy()">⧉ コピー</button><button class="secondary" onclick="unlock()">🔓 全解除</button></div>

<section class="panel"><details><summary>🔎 関連ワード</summary><input id="relIn" placeholder="例：夏、猫、雨"><button class="secondary" style="margin-top:8px;width:100%" onclick="related()">🔎 探す</button><button class="secondary" style="margin-top:8px;width:100%" onclick="relatedAxisGen()">🧭 関連ワードを主軸に生成</button><div id="relOut"></div></details></section>
<section class="panel"><details><summary>🎉 イベント</summary><select id="event"></select><button class="secondary" style="margin-top:8px;width:100%" onclick="eventGen()">🎉 イベントで生成</button></details></section>
<section class="panel"><details><summary>👤 マイデータ</summary><div class="small">自分用のワードを追加できます。端末内に保存されます。</div>
<div class="field"><label>ワード</label><input id="cw" placeholder="例：宇宙船"></div><div class="field"><label>カテゴリ</label><select id="cc"></select></div>
<div class="field"><label>関連ワード（カンマ区切り）</label><input id="cr" placeholder="宇宙,星,SF"></div><button class="secondary" onclick="addCustom()">＋追加</button><div id="custom"></div>
</details></section>
<div id="status" class="status"></div>
<section><h3>保存したお題</h3><div id="saved" class="small">まだありません。</div></section>
</main>

 let axis=seed.__axis||ax.axis, axisValue=seed.__axisValue||ax.value;
 if(axis==="おまかせ"){axis=pick(["場所","シチュエーション","行動","注目部位","性格","髪型","衣装","イベント"]);axisValue=axis==="イベント"?pick(Object.keys(E)):pick(AXIS_VALUES[axis]?AXIS_VALUES[axis]():[])}
 if(axis==="テーマ"&&themeIn?.value.trim())Object.assign(seed,themeSeed(themeIn.value.trim()).seed);
 if(axis==="イベント"&&axisValue&&E[axisValue])seed={...seed,イベント:axisValue};
 if(seed.イベント&&E[seed.イベント]){let d=E[seed.イベント];seed={...seed,季節:seed.季節||d[0],衣装:seed.衣装||d[2],小物:seed.小物||pick(d[3])};if(!seed.場所&&DB.場所.some(x=>x[0]===d[1]))seed.場所=d[1];}
 if(axis==="場所"&&axisValue)seed.場所=axisValue;
 if(axis==="シチュエーション"&&axisValue)seed.シチュエーション=axisValue;
 if(axis==="行動"&&axisValue)seed.行動=axisValue;
 if(axis==="注目部位"&&axisValue)seed.注目部位=axisValue;
 if(axis==="性格"&&axisValue)seed.性格=axisValue;if(axis==="髪型"&&axisValue)seed.髪型=axisValue;if(axis==="衣装"&&axisValue)seed.衣装=axisValue;
 if(axis==="人物"&&axisValue)seed.人数=axisValue;
 let x=(seed.場所&&DB.場所.find(z=>z[0]===seed.場所))||pick(DB.場所), place=x[0];
 const season=seed.季節||((locks.季節&&current?.季節)?current.季節:null)||pick(x[1]);
 const rel=n=>n==="1人"?"一人":n==="2人"?pick(fantasy?FANTASY_REL.slice(1):["友人","親友","恋人","兄弟・姉妹","同僚","初対面"]):pick(fantasy?["仲間たち","冒険者の一行","魔法使いの集まり"]:["友人グループ","同僚たち","家族","クラスメイト"]);
 const choose=(k,fn)=>{if(enabled[k]===false)return;if(seed[k]!=null){o[k]=seed[k];return}if(locks[k]&&current?.[k]!=null){o[k]=current[k];return}o[k]=fn()};
 choose("性別",()=>pick(PEOPLE.性別));choose("年齢",()=>pick(PEOPLE.年齢));choose("髪色",()=>pick(PEOPLE.髪色));choose("瞳の色",()=>pick(PEOPLE.瞳の色));choose("性格",()=>pick(PEOPLE.性格));choose("髪型",()=>pick(PEOPLE.髪型));choose("人数",()=>pick(PEOPLE.人数));choose("関係性",()=>rel(o.人数||"1人"));choose("場所",()=>place);choose("季節",()=>season);
 choose("時間",()=>pick(x[2]));choose("衣装",()=>fantasy?pick(FANTASY.衣装):pick(seasonalClothes(season)));
 choose("職業",()=>fantasy?pick(["魔法使い","冒険者","騎士","錬金術師","研究者"]):(o.年齢==="10代"?"学生":pick(["会社員","教師","医師","店員","公務員","フリーランス","アーティスト"])));
 // 髪色・瞳色のイメージを性格へ反映（明示指定・ロックは優先）
 if(enabled.性格!==false&&!locks.性格&&!seed.性格){
   const cp=colorPersonalityCandidates(o.髪色,o.瞳の色);
   if(cp.length)o.性格=pick(cp);
 }

 let scenes=sceneList(place); if(!locks.シチュエーション&&!seed.シチュエーション&&axis!=="シチュエーション"){if(seed.イベント&&E[seed.イベント])scenes=[pick(E[seed.イベント][4])];else if(axis==="イベント"&&E[axisValue])scenes=E[axisValue][4].map(v=>sceneList(place).includes(v)?v:sceneList(place)[0]);}
 choose("シチュエーション",()=>pick(scenes));
 let acts=sceneActions(place,o.シチュエーション);
 if(seed.行動==null&&!locks.行動&&enabled.行動!==false&&locks.距離&&current?.距離){let a=actionsForDistance(acts,current.距離);if(a.length)acts=a}
 choose("行動",()=>pick(acts));
 choose("注目部位",()=>pick(Object.keys(F).filter(z=>z!=="なし")));
 let distPool=distanceForAction(o.行動,o.注目部位||"なし");
 if(enabled.距離!==false&&!locks.距離&&!seed.距離)o.距離=pick(["離れてる","隣","目の前"].filter(x=>distPool.includes(x)).length?["離れてる","隣","目の前"].filter(x=>distPool.includes(x)): ["隣","目の前"]);
 else if(enabled.距離!==false&&!o.距離&&current?.距離)o.距離=current.距離;
 if(enabled.アングル!==false&&!locks.アングル&&!seed.アングル){o.アングル=pick(["煽り","俯瞰"])}
 if(enabled.向き!==false&&!locks.向き&&!seed.向き){let dirs=FOCUS_DIR[o.注目部位]||["正面","斜め前","横"];o.向き=pick(dirs)}
 choose("ポーズ",()=>pick(F[o.注目部位||"なし"]||F.なし));
 choose("表情",()=>pick(PERSONALITY_EXPRESSIONS[o.性格]||DB.表情));
 choose("小物",()=>seed.小物|| (fantasy?pick(FANTASY.小物):pick(["スマホ","傘","飲み物","本","バッグ","イヤホン"])));
 choose("非現実要素",()=>fantasy?pick(FANTASY.非現実要素):"なし");
 if(seed.イベント)o.イベント=seed.イベント;if(seed.テーマ)o.テーマ=seed.テーマ;if(seed.テーマ補足)o.テーマ補足=seed.テーマ補足;
 // 主軸を優先しつつ、イベントの小物・行動を自然に反映
 if(axis==="イベント"&&E[axisValue]){o.イベント=axisValue;o.小物=seed.小物||pick(E[axisValue][3]);let ea=E[axisValue][4];if(!locks.行動&&!seed.行動&&ea.length){let aa=ea.filter(a=>!locks.距離||!current?.距離||distanceForAction(a,o.注目部位).includes(current.距離));if(aa.length)o.行動=pick(aa)}}
 return o;
}
function groupFor(k){
 if(["性別","年齢","性格","髪型","髪色","瞳の色","職業","人数","関係性"].includes(k))return ["🧑","キャラクター"];
 if(["衣装"].includes(k))return ["👗","スタイル"];
 if(["場所","時間","季節","シチュエーション","行動"].includes(k))return ["🎬","シーン"];
 if(["距離","アングル","向き","注目部位","ポーズ","小物"].includes(k))return ["📐","構図"];
 return ["💭","雰囲気"];
}
const GROUPS=[["キャラクター",["性別","年齢","性格","髪型","髪色","瞳の色","職業","人数","関係性"]],["スタイル",["衣装"]],["シーン",["場所","時間","季節","シチュエーション","行動"]],["構図",["距離","アングル","向き","注目部位","ポーズ","小物"]],["雰囲気",["表情","非現実要素","イベント","テーマ"]]];
function render(){
 const src=current||{};
 result.innerHTML=GROUPS.map(([gn,fields])=>{const shown=fields.filter(k=>Object.prototype.hasOwnProperty.call(src,k));if(!shown.length)return '';const lead=shown[0];return `<section class="panel"><div class="row" style="align-items:center"><h2 style="margin:0;font-size:20px;flex:1">${groupFor(lead)[0]} ${gn} <span class="small">｜${lead}：${esc(src[lead])}</span></h2><button class="secondary" onclick="regenGroup('${gn}')">🔄</button></div>${shown.map(k=>`<div class="card" style="box-shadow:none;margin:8px 0 0;padding:10px 0;border-radius:0;border-width:1px 0 0"><div class="row"><div class="icon">${I[k]||"✨"}</div><div style="flex:1"><div class="label">${k}</div><div class="value">${esc(src[k])}</div></div>${K.includes(k)?`<button class="lock ${locks[k]?"on":""}" onclick="lock('${k}')">${locks[k]?"🔒":"🔓"}</button>`:""}</div></div>`).join('')}</section>`}).join('');
}
function regenGroup(name){const g=GROUPS.find(x=>x[0]===name);if(!g||!current)return;const seed={...current};for(const k of g[1])if(!locks[k])delete seed[k];current=make(seed);render();sync();status.textContent=name+'を再生成しました！'}

function generate(){current=make();render();sync();status.textContent="新しいアイデアを生成しました！"}
function lock(k){locks[k]=!locks[k];localStorage.ideaLocks=JSON.stringify(locks);render()}
function unlock(){locks={};localStorage.ideaLocks="{}";render()}
function copy(){navigator.clipboard?.writeText(Object.keys(current).map(k=>(I[k]||"✨")+" "+k+"："+current[k]).join("\n"));status.textContent="コピーしました！"}
function save(){let a=JSON.parse(localStorage.drawingIdeas||"[]");a.unshift(current);localStorage.drawingIdeas=JSON.stringify(a.slice(0,30));saved()}
function saved(){let a=JSON.parse(localStorage.drawingIdeas||"[]");document.getElementById("saved").innerHTML=a.length?a.map((x,i)=>`<div class="card"><b>${esc(x.場所||"")}</b>・${esc(x.季節||"")}・${esc(x.時間||"")}<div class="small">${esc(x.衣装||"")}／${esc(x.シチュエーション||"")}</div><button class="danger" onclick="del(${i})">削除</button></div>`).join(""):"まだありません。"}
function del(i){let a=JSON.parse(localStorage.drawingIdeas||"[]");a.splice(i,1);localStorage.drawingIdeas=JSON.stringify(a);saved()}
function setupAxis(){
 const a=document.getElementById("axis"),v=document.getElementById("axisValue");if(!a||!v)return;
 const axes=["おまかせ","場所","シチュエーション","行動","注目部位","性格","髪型","髪色","瞳の色","衣装","人物","イベント","テーマ"];
 a.innerHTML=axes.map(x=>`<option>${x}</option>`).join("");
 a.onchange=()=>{axisValues();if(a.value==="テーマ")status.textContent="テーマ欄の入力を主軸にします。"};
 axisValues();
}
function axisValues(){
 const a=document.getElementById("axis"),v=document.getElementById("axisValue");if(!a||!v)return;let k=a.value;
 if(k==="テーマ"){v.innerHTML='<option>テーマ欄を使用</option>';v.disabled=true;return}
 v.disabled=false;
 if(k==="おまかせ"){v.innerHTML='<option>ランダムに決める</option>';return}
 let vals=AXIS_VALUES[k]?AXIS_VALUES[k]():[];v.innerHTML=vals.map(x=>`<option>${esc(x)}</option>`).join("");
}
function bodyGen(){const c=document.getElementById("bodyCat")?.value;if(!c)return;const words=BODY_DATA[c]||[];const focusWords=words.filter(x=>Object.prototype.hasOwnProperty.call(F,x));const seed={};seed.注目部位=focusWords.length?pick(focusWords):pick(Object.keys(F).filter(x=>x!=="なし"));seed.ポーズ=pick(words.filter(x=>!Object.prototype.hasOwnProperty.call(F,x))||words);current=make(seed);current.注目部位=seed.注目部位;current.ポーズ=seed.ポーズ||pick(F[current.注目部位]||F.なし);render();sync();status.textContent='「'+c+'」を主軸に生成しました！'}
function relatedAxisGen(){const q=(document.getElementById('relIn')?.value||'').trim();if(!q){status.textContent='ワードを入力してね。';return}const vals=RELATED_CATEGORIES[q]||R[q]||[];if(!vals.length){related();return}const w=pick(vals);let seed={};if(/海|浜|水族|プール/.test(w))seed.場所='海辺';if(/学校|教室|屋上|制服|文化祭/.test(w))seed.場所='学校の屋上';if(/神社|鳥居|参拝|おみくじ/.test(w))seed.場所='古い神社';if(/雨|傘|水たまり/.test(w))seed.場所='雨上がりの商店街';if(/夏|花火|浴衣/.test(w))seed.季節='夏';if(/雪|クリスマス|イルミ/.test(w))seed.季節='冬';if(/桜|花見/.test(w))seed.季節='春';if(/紅葉|落ち葉|ハロウィン/.test(w))seed.季節='秋';if(Object.values(PEOPLE.髪色).includes(w))seed.髪色=w;if(Object.values(PEOPLE.瞳の色).includes(w))seed.瞳の色=w;seed.小物=w;current=make(seed);current.小物=w;render();sync();status.textContent='「'+q+'」の関連ワード「'+w+'」を主軸に生成しました！'}
function setup(){
 setupAxis();
 const bodyEl=document.getElementById("bodyCat"); if(bodyEl) bodyEl.innerHTML=Object.keys(BODY_DATA).map(k=>`<option>${esc(k)}</option>`).join("");
 const checksEl=document.getElementById("checks"), focusEl=document.getElementById("focus"), eventEl=document.getElementById("event"), ccEl=document.getElementById("cc");
 checksEl.innerHTML=K.map(k=>`<label class="check"><input type="checkbox" ${enabled[k]!==false?"checked":""} onchange="en('${k}',this.checked)"> ${I[k]} ${k}</label>`).join("");

function en(k,v){enabled[k]=v;localStorage.ideaEnabled=JSON.stringify(enabled);render()}
document.getElementById("focus").onchange=()=>{current=current||make();current.注目部位=document.getElementById("focus").value;current.ポーズ=pick(F[current.注目部位]||F.なし);render();sync()}

function world(m){worldMode=m==="random"?pick(["real","fantasy"]):m;localStorage.ideaWorld=worldMode;document.getElementById("mr").classList.toggle("active",worldMode==="real");document.getElementById("mf").classList.toggle("active",worldMode==="fantasy");generate();status.textContent=worldMode==="real"?"現実系で生成しました！":"ファンタジー系で生成しました！"}
function mode(m){theme.classList.toggle("hidden",m!="theme");tn.classList.toggle("active",m=="normal");tt.classList.toggle("active",m=="theme")}
const THEME_BUNDLES=[
 {keys:["夏","青春","海"],o:{場所:"海辺",時間:"夕方",季節:"夏",衣装:"私服",表情:"楽しそう",シチュエーション:"景色を眺めている",距離:"離れてる",アングル:"煽り",向き:"斜め前"},extra:["風で髪や服が揺れる","入道雲","飲み物やアイス"]},
 {keys:["雨","一人","帰る","帰宅"],o:{場所:"雨上がりの商店街",時間:"夕方",季節:"秋",衣装:"私服＋薄手の上着",表情:"少し寂しげ",シチュエーション:"帰るところ",距離:"隣",アングル:"煽り",向き:"斜め前"},extra:["傘","濡れた路面","駅へ向かう"]},
 {keys:["寂しい","孤独","切ない"],o:{場所:"駅のホーム",時間:"夕方",季節:"秋",衣装:"コート＋マフラー",表情:"少し寂しげ",シチュエーション:"一人で物思いにふけっている",距離:"離れてる",アングル:"煽り",向き:"後ろ姿"},extra:["遠くの電車","冷たい風","誰かを待った痕跡"]},
 {keys:["楽しい","明るい"],o:{場所:"学校の屋上",時間:"放課後",季節:"夏",衣装:"制服",表情:"穏やかな笑顔",シチュエーション:"友人と話している",距離:"隣",アングル:"煽り",向き:"斜め前"},extra:["風で髪が揺れる","青空","飲み物"]},
 {keys:["不安","怖い"],o:{場所:"古い神社",時間:"夜",季節:"冬",衣装:"コート＋マフラー",表情:"不安そう",シチュエーション:"何かを探している",距離:"離れてる",アングル:"俯瞰",向き:"斜め後ろ"},extra:["遠くの灯り","足音","古い看板"]}
];
function themeGen(){
 const s=themeIn.value.trim();if(!s){status.textContent="テーマを入力してね。";return}
 const t=themeSeed(s), hits=THEME_BUNDLES.filter(b=>b.keys.some(k=>s.includes(k)));let o={...t.seed};
 if(/魔法|異世界|妖精|ドラゴン|魔王|冒険|魔導|ファンタジー/.test(s))worldMode="fantasy";
 if(!o.イベント&&hits.length){let b=hits[0];Object.assign(o,b.o);o.テーマ補足=b.extra.join("／")}
 o.テーマ=s; if(!o.テーマ補足)o.テーマ補足=t.hints.join("／");
 current=make({...o,__axis:"テーマ",__axisValue:s});render();sync();status.textContent="「"+s+"」を主軸に生成しました！";
}
function themeRandom(){themeIn.value=pick(["ちょっと寂しい絵","夏の青春","雨の日に一人で帰る感じ","明るくて楽しい絵","ちょっと不安になる雰囲気"]);themeGen()}

const T=["風で髪や服が少し揺れる瞬間にする","遠くに誰かの姿を小さく入れる","足元に落ちた何かに気づく","ふとスマホに通知が届く","背景に季節を感じる小さな出来事を入れる"],O=["古いラジオ","巨大な風船","一輪だけの花","見覚えのない鍵","レトロなカメラ","紙飛行機","小さなトランク","金魚鉢","古い地図","片方だけの手袋"];
function extra(){let z=document.getElementById("extra");if(z)z.remove();let ks=["もう一捻り","異物","少し前","少し後"].filter(k=>current[k]);if(!ks.length)return;z=document.createElement("div");z.id="extra";z.className="panel";z.innerHTML="<b>✨ 追加アイデア</b>"+ks.map(k=>`<div class="story"><b>${k}</b><br>${esc(current[k])}</div>`).join("");result.after(z)}
function twist(){current["もう一捻り"]=pick(T);extra()}function odd(){current["異物"]=pick(O);extra()}function story(){current["少し前"]=pick(["学校や家を出てここへ向かった","誰かと話したあと一人になった","何かを探しながら来た"]);current["少し後"]=pick(["少しして誰かが現れる","そのまま帰る","思いがけない出来事が起こる"]);extra()}
function related(){let q=relIn.value.trim(),a=RELATED_CATEGORIES[q]||R[q]||[];const key=Object.keys(R).find(k=>k===q||k.includes(q)||q.includes(k));if(!a.length&&key)a=R[key];custom.filter(x=>x.word===q).forEach(x=>a=a.concat(x.related));a=[...new Set(a)];relOut.innerHTML=a.length?a.map(x=>`<span class="tag">${esc(x)}</span>`).join(""):"<div class='small'>未登録です。マイデータから追加できます。</div>"}
function eventGen(){const ev=document.getElementById("event").value,d=E[ev],o={季節:d[0],衣装:pick(d[2]),シチュエーション:pick(d[4])};if(D.場所.some(x=>x[0]==d[1]))o.場所=d[1];current=make(o);current.イベント=ev;current.小物=pick(d[3]);render();sync();status.textContent=ev+"を中心に生成しました！"}
function addCustom(){let w=cw.value.trim();if(!w)return;custom.push({word:w,category:cc.value,related:cr.value.split(",").map(x=>x.trim()).filter(Boolean)});localStorage.ideaCustom=JSON.stringify(custom);cw.value="";cr.value="";renderCustom()}

setup();document.getElementById("mr").classList.toggle("active",worldMode==="real");document.getElementById("mf").classList.toggle("active",worldMode==="fantasy");generate();saved();
