function renderAxis(){const p=document.getElementById('axisPanel'); if(state.axisTab==='detail'){p.innerHTML='<div class="sectionTitle">詳細キーワード</div><input class="input" id="axisDetail" placeholder="例：神社・寺、クリスマス、胸元"><div class="small" style="margin-top:6px">入力した言葉を主軸候補として扱います。</div>';return} if(state.axisTab==='main'){p.innerHTML='<div class="panelGrid"><div class="row"><span class="label">大枠</span><select id="axisSelect">'+['おまかせ','場所','シチュエーション','行動','注目部位','衣装','人物','イベント','テーマ','性格','髪型','髪色','瞳の色'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="row"><span class="label">詳細</span><select id="axisValue"><option>おまかせ</option></select></div></div>'; const s=document.getElementById('axisSelect');s.value=state.axis;s.onchange=()=>{state.axis=s.value;updateAxisValues()};updateAxisValues();return} p.innerHTML='<div class="seg"><button data-world="real">🏙️ 現実系</button><button data-world="fantasy">🧙 ファンタジー系</button><button data-world="random">🎲 おまかせ</button></div><div class="small" style="margin-top:7px">現実系は現実的な場所・服・イベント中心。ファンタジー系は魔法・異世界要素を使用。</div>';p.querySelectorAll('[data-world]').forEach(b=>{b.classList.toggle('active',b.dataset.world===state.world);b.onclick=()=>{state.world=b.dataset.world;renderAxis();}})}

function renderItems(cat){let box=document.getElementById('details-'+cat);box.innerHTML='';for(const k of fields[cat]){let v=state.out[k]??'—';let row=document.createElement('div');row.className='item'+(state.enabled[k]?'':' off');let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!state.enabled[k];cb.onchange=()=>{state.enabled[k]=cb.checked;row.classList.toggle('off',!cb.checked)};let val=document.createElement('select');val.className='input';let opts=k==='衣装系統'?styleCandidates():k==='衣装'?styleOutfitCandidatesForUI():candidates(k);val.innerHTML=uniq([v,...opts]).map(x=>'<option>'+x+'</option>').join('');val.value=v;val.onchange=()=>{state.out[k]=val.value;if(k==='衣装系統'){let ts=styleTypes(val.value);if(!ts.includes(state.out._衣装タイプ))state.out._衣装タイプ=ts[0]||'';let allowed=styleOutfits(val.value,state.out._衣装タイプ);if(!state.locked.衣装&&!allowed.includes(state.out.衣装))state.out.衣装=pick(allowed)}else if(k==='衣装'&&state.out.衣装系統){let types=styleTypes(state.out.衣装系統);let t=types.find(t=>styleOutfits(state.out.衣装系統,t).includes(val.value));if(t)state.out._衣装タイプ=t}renderAll()};let lk=document.createElement('button');lk.className='lock'+(state.locked[k]?' on':'');lk.textContent=state.locked[k]?'🔒':'🔓';lk.onclick=()=>{state.locked[k]=!state.locked[k];lk.textContent=state.locked[k]?'🔒':'🔓';lk.classList.toggle('on',state.locked[k])};row.append(cb,val,lk);box.appendChild(row)}}
function styleOutfitCandidatesForUI(){let g=state.out.衣装系統;if(!g||!STYLE_TREE[g])return uniq(Object.values(STYLE_TREE).flatMap(x=>Object.values(x).flat()).flat());let ts=styleTypes(g);return uniq(ts.flatMap(t=>styleOutfits(g,t)))}

const STYLE_TREE={
 '私服':{ '清楚系':['ワンピース','ブラウス＋スカート','ニット＋スカート'], 'カジュアル系':['パーカー＋スカート','Tシャツ＋デニム'], 'ガーリー系':['フリルワンピース','フリルブラウス＋スカート'], '大人っぽい系':['タイトワンピース','ブラウス＋ロングスカート'], 'スポーティー系':['スポーツミックス','パーカー＋パンツ'] },

function styleContext(){const ev=state.out.イベント|| (state.axis==='イベント'?state.axisValue:'');const p=state.out.場所||'';if(ev==='クリスマス')return {group:['コスプレ','私服','フォーマル'],type:{'コスプレ':['サンタ']}};if(ev==='ハロウィン')return {group:['コスプレ'],type:{'コスプレ':['魔法使い','悪魔']}};if(ev==='お正月')return {group:['和風','私服'],type:{'和風':['着物','浴衣','巫女']}};if(/神社|寺/.test(p))return {group:['和風','私服'],type:{'和風':['着物','浴衣','巫女']}};if(/学校|教室|校庭|屋上|部室|図書室/.test(p))return {group:['制服','私服'],type:{'制服':['学校制服']}};if(/海|プール/.test(p))return {group:['スポーツ','私服'],type:{'スポーツ':['競技ウェア']}};return null}
function styleCandidates(){let ctx=styleContext();let groups=ctx?.group||Object.keys(STYLE_TREE);return groups.filter(g=>STYLE_TREE[g]);}

function generateStyle(){
 const ctx=styleContext();

function regen(cat){

 if(cat==='style'){
   generateStyle();
