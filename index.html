const SCENE_ACTIONS_GENERIC={
"誰かを待っている":["通りの先を見る","スマホを確認しながら待つ","その場で立ち止まる"],
"友人と話している":["友人と話す","笑いながら振り向く","相手の話を聞く"],
"一人で物思いにふけっている":["遠くを見つめる","静かに立ち止まる","考えながら歩く"],
"何かを探している":["周囲を見回す","足元を覗き込む","落ちているものを探す"],
"偶然誰かと出会う":["驚いて振り返る","相手に手を振る","話しかけようと近づく"],
"帰るところ":["歩きながら振り返る","帰る方向へ歩く","荷物を持ち直す"],
"景色を眺めている":["景色を眺めながら立つ","遠くを見つめる","ゆっくり振り返る"],
"仲間と話している":["仲間と相談する","地図を広げて話す","相手の話を聞く"],
"未知の場所を訪れる":["周囲を見回す","慎重に歩く","目の前のものを調べる"]
};

const ACTION_DISTANCE_RULES=[
 [/靴|足元|足先|波打ち際|歩く|走る|階段|しゃがむ|座る|脚|落ち葉を踏む/ ,["膝上","全身","遠景"]],
 [/お賽銭|手を合わせる|鈴を鳴らす|手を振る|スマホ|話す|相談|地図|飲み物|髪|顔|表情|文字|読む|見る|見つめる|眺める|覗き込む/ ,["バストアップ","腰上","膝上"]],
 [/見上げる|空を/ ,["腰上","膝上","全身"]],
];

function actionFitsDistance(action,distance){
 if(!action||!distance)return true;
 return ACTION_DISTANCE_RULES.some(([re,ds])=>re.test(action)&&ds.includes(distance)) ||
   (!/靴|足元|足先|波打ち際|歩く|走る|階段|しゃがむ|座る|脚|落ち葉を踏む/.test(action) || distance!=="バストアップ");
}
function distancesForAction(action){
 if(/靴|足元|足先|波打ち際|歩く|走る|階段|しゃがむ|座る|脚|落ち葉を踏む/.test(action))return["膝上","全身","遠景"];
 if(/見上げる|空を/.test(action))return["腰上","膝上","全身"];
 if(/お賽銭|手を合わせる|鈴を鳴らす|手を振る|スマホ|話す|相談|地図|飲み物|髪|文字|読む|見つめる|眺める|覗き込む/.test(action))return["バストアップ","腰上","膝上"];
 return["腰上","膝上","全身"];
}
function sceneForAction(place,action,db){
 const local=SCENE_ACTIONS[place]||{};
 for(const [scene,acts] of Object.entries(local))if(acts.includes(action))return scene;
 for(const [scene,acts] of Object.entries(SCENE_ACTIONS_GENERIC))if(acts.includes(action))return scene;
 const row=db.場所.find(z=>z[0]===place);
 return row?.[4]?.[0]||"景色を眺めている";
}

function make(seed={}){
 const fantasy=worldMode==="fantasy";
 const DB=fantasy?FANTASY:D;
 let x=(seed.場所&&DB.場所.find(z=>z[0]===seed.場所))||pick(DB.場所);
 let o={};
 const season=seed.季節||((locks.季節&&current?.季節)?current.季節:null)||pick(x[1]);
 const rel=n=>n==="1人"?"一人":n==="2人"?pick(fantasy?FANTASY_REL.slice(1):["友人","親友","恋人","兄弟・姉妹","同僚","初対面"]):pick(fantasy?["仲間とライバルが混在","仲間たち","冒険者の一行","魔法使いの集まり"]:["友人グループ","同僚たち","家族","クラスメイト"]);

 // 基本情報を先に決める。シチュエーション→行動→距離の順で依存関係を作る。
 for(const k of ["性別","年齢","職業","人数","関係性","場所","時間","季節","衣装","表情","注目部位","小物","非現実要素"]){
   if(enabled[k]===false)continue;
   if(seed[k]!=null){o[k]=seed[k];continue}
   if(locks[k]&&current?.[k]!=null){o[k]=current[k];continue}
   if(k==="性別")o[k]=pick(PEOPLE.性別);
   else if(k==="年齢")o[k]=pick(PEOPLE.年齢);
   else if(k==="人数")o[k]=pick(PEOPLE.人数);
   else if(k==="関係性")o[k]=rel(o.人数||"1人");
   else if(k==="場所")o[k]=x[0];
   else if(k==="季節")o[k]=season;
   else if(k==="衣装")o[k]=fantasy?pick(FANTASY.衣装):pick(seasonalClothes(season));
   else if(k==="職業")o[k]=fantasy?pick(["魔法使い","冒険者","騎士","錬金術師","研究者"]):((o.年齢==="10代")?"学生":pick(["会社員","教師","医師","店員","公務員","フリーランス","アーティスト"]));
   else if(k==="注目部位")o[k]=pick(Object.keys(F).filter(z=>z!=="なし"));
   else if(k==="小物")o[k]=fantasy?pick(FANTASY.小物):pick(["スマホ","傘","飲み物","本","バッグ","イヤホン"]);
   else if(k==="非現実要素")o[k]=fantasy?pick(FANTASY.非現実要素):"なし";
 }
 x=(DB.場所.find(z=>z[0]===o.場所)||x);

 if(enabled.時間!==false){
   if(seed.時間!=null)o.時間=seed.時間;
   else if(!(locks.時間&&current?.時間)&&(!x[2].includes(o.時間)))o.時間=pick(x[2]);
 }
 if(enabled.シチュエーション!==false){
   const lockedScene=locks.シチュエーション&&!seed.シチュエーション&&current?.シチュエーション;
   if(seed.シチュエーション!=null)o.シチュエーション=seed.シチュエーション;
   else if(lockedScene)o.シチュエーション=lockedScene;
   else o.シチュエーション=pick(x[4]);
 }

 // 行動は「場所＋シチュエーション」から選ぶ。行動ロックがある場合は逆向きに整合させる。
 const localActions=SCENE_ACTIONS[o.場所]?.[o.シチュエーション]||
   SCENE_ACTIONS_GENERIC[o.シチュエーション]||
   (ACTIONS[o.場所]||GENERIC_ACTIONS);
 if(enabled.行動!==false){
   if(seed.行動!=null)o.行動=seed.行動;
   else if(locks.行動&&current?.行動)o.行動=current.行動;
   else {
     let candidates=localActions;
     const lockedDistance=locks.距離&&!seed.距離&&current?.距離;
     if(lockedDistance){
       const filtered=candidates.filter(a=>actionFitsDistance(a,lockedDistance));
       if(filtered.length)candidates=filtered;
     }
     o.行動=pick(candidates);
   }
 }

 // 行動が固定されていてシチュエーションが未固定なら、その行動に合うシチュエーションへ。
 if(enabled.シチュエーション!==false&&!locks.シチュエーション&&!seed.シチュエーション&&o.行動){
   const inferred=sceneForAction(o.場所,o.行動,DB);
   if(inferred)o.シチュエーション=inferred;
 }

 if(!fantasy&&!locks.衣装&&!seed.衣装&&enabled.衣装!==false&&!seasonalClothes(o.季節||season).includes(o.衣装))o.衣装=pick(seasonalClothes(o.季節||season));
 if(!locks.関係性&&!seed.関係性&&enabled.関係性!==false)o.関係性=rel(o.人数||"1人");
 if(!locks.職業&&!seed.職業&&enabled.職業!==false&&o.年齢==="10代"&&!fantasy)o.職業="学生";

 // 注目部位→ポーズ。ここは既存仕様を維持。
 const focus=o.注目部位, poses=F[focus]||F.なし;
 if(enabled.ポーズ!==false&&!locks.ポーズ&&!seed.ポーズ)o.ポーズ=pick(poses);

 // 距離は「行動」と「注目部位」の両方を満たすものから選ぶ。
 if(enabled.距離!==false){
   const focusDs=/顔|目/.test(focus)?["バストアップ","腰上"]:
     /胸元|胸|背中|腰|お腹/.test(focus)?["バストアップ","腰上","膝上"]:
     /腿|膝/.test(focus)?["膝上","全身"]:
     /鼠径部|脚|足首|足|足先/.test(focus)?["全身","遠景"]:
     ["腰上","膝上","全身"];
   const actionDs=distancesForAction(o.行動);
   const allowed=focusDs.filter(d=>actionDs.includes(d));
   const lockedDistance=locks.距離&&!seed.距離&&current?.距離;
   if(seed.距離!=null)o.距離=seed.距離;
   else if(lockedDistance)o.距離=lockedDistance;
   else o.距離=pick(allowed.length?allowed:actionDs);
 }

 if(enabled.向き!==false&&!locks.向き&&!seed.向き&&/背中/.test(focus))o.向き=pick(["斜め後ろ","後ろ姿"]);
 if(enabled.アングル!==false&&!locks.アングル&&!seed.アングル&&/足|脚|腿/.test(focus))o.アングル=pick(["少し見上げる（ローアングル）","目線の高さ"]);
 if(enabled.アングル!==false&&!o.アングル)o.アングル=pick(DB.アングル||D.アングル);
 if(enabled.向き!==false&&!o.向き)o.向き=pick(DB.向き||D.向き);

 return o;
}

function render(){result.innerHTML=Object.keys(current||{}).map(k=>`<div class="card"><div class="row"><div class="icon">${I[k]||"✨"}</div><div style="flex:1"><div class="label">${k}</div><div class="value">${esc(current[k])}</div></div>${K.includes(k)?`<button class="lock ${locks[k]?"on":""}" onclick="lock('${k}')">${locks[k]?"🔒":"🔓"}</button>`:""}</div></div>`).join("")}
function generate(){current=make();render();sync();status.textContent="新しいアイデアを生成しました！"}
function lock(k){locks[k]=!locks[k];localStorage.ideaLocks=JSON.stringify(locks);render()}
function unlock(){locks={};localStorage.ideaLocks="{}";render()}
function copy(){navigator.clipboard?.writeText(Object.keys(current).map(k=>(I[k]||"✨")+" "+k+"："+current[k]).join("\n"));status.textContent="コピーしました！"}
function save(){let a=JSON.parse(localStorage.drawingIdeas||"[]");a.unshift(current);localStorage.drawingIdeas=JSON.stringify(a.slice(0,30));saved()}
function saved(){let a=JSON.parse(localStorage.drawingIdeas||"[]");document.getElementById("saved").innerHTML=a.length?a.map((x,i)=>`<div class="card"><b>${esc(x.場所||"")}</b>・${esc(x.季節||"")}・${esc(x.時間||"")}<div class="small">${esc(x.衣装||"")}／${esc(x.シチュエーション||"")}</div><button class="danger" onclick="del(${i})">削除</button></div>`).join(""):"まだありません。"}
function del(i){let a=JSON.parse(localStorage.drawingIdeas||"[]");a.splice(i,1);localStorage.drawingIdeas=JSON.stringify(a);saved()}
function setup(){
 const checksEl=document.getElementById("checks"), focusEl=document.getElementById("focus"), eventEl=document.getElementById("event"), ccEl=document.getElementById("cc");
 checksEl.innerHTML=K.map(k=>`<label class="check"><input type="checkbox" ${enabled[k]!==false?"checked":""} onchange="en('${k}',this.checked)"> ${I[k]} ${k}</label>`).join("");
 focusEl.innerHTML=Object.keys(F).map(k=>`<option>${k}</option>`).join("");
 eventEl.innerHTML=Object.keys(E).map(k=>`<option>${k}</option>`).join("");
 ccEl.innerHTML=K.concat(["テーマ"]).map(k=>`<option>${k}</option>`).join("");
 renderCustom();
}

function en(k,v){enabled[k]=v;localStorage.ideaEnabled=JSON.stringify(enabled);render()}
document.getElementById("focus").onchange=()=>{current=current||make();current.注目部位=document.getElementById("focus").value;current.ポーズ=pick(F[current.注目部位]||F.なし);render();sync()}
document.getElementById("pose").onchange=()=>{current=current||make();current.ポーズ=document.getElementById("pose").value;render()}
function sync(){const f=document.getElementById("focus"),ps=document.getElementById("pose");f.value=current?.注目部位||"なし";ps.innerHTML=(F[f.value]||F.なし).map(x=>`<option>${x}</option>`).join("");if(current?.ポーズ)ps.value=current.ポーズ}

function world(m){worldMode=m==="random"?pick(["real","fantasy"]):m;localStorage.ideaWorld=worldMode;document.getElementById("mr").classList.toggle("active",worldMode==="real");document.getElementById("mf").classList.toggle("active",worldMode==="fantasy");generate();status.textContent=worldMode==="real"?"現実系で生成しました！":"ファンタジー系で生成しました！"}
function mode(m){theme.classList.toggle("hidden",m!="theme");tn.classList.toggle("active",m=="normal");tt.classList.toggle("active",m=="theme")}
const THEME_BUNDLES=[
 {keys:["夏","青春","海"],o:{場所:"海辺",時間:"夕方",季節:"夏",衣装:"私服",表情:"楽しそう",シチュエーション:"景色を眺めている",距離:"遠景",アングル:"目線の高さ",向き:"斜め前"},extra:["風で髪や服が揺れる","入道雲","飲み物やアイス"]},
 {keys:["雨","一人","帰る","帰宅"],o:{場所:"雨上がりの商店街",時間:"夕方",季節:"秋",衣装:"私服＋薄手の上着",表情:"少し寂しげ",シチュエーション:"帰るところ",距離:"腰上",アングル:"目線の高さ",向き:"斜め前"},extra:["傘","濡れた路面","駅へ向かう"]},
 {keys:["寂しい","孤独","切ない"],o:{場所:"駅のホーム",時間:"夕方",季節:"秋",衣装:"コート＋マフラー",表情:"少し寂しげ",シチュエーション:"一人で物思いにふけっている",距離:"全身",アングル:"目線の高さ",向き:"後ろ姿"},extra:["遠くの電車","冷たい風","誰かを待った痕跡"]},
 {keys:["楽しい","明るい"],o:{場所:"学校の屋上",時間:"放課後",季節:"夏",衣装:"制服",表情:"穏やかな笑顔",シチュエーション:"友人と話している",距離:"腰上",アングル:"少し見上げる（ローアングル）",向き:"斜め前"},extra:["風で髪が揺れる","青空","飲み物"]},
 {keys:["不安","怖い"],o:{場所:"古い神社",時間:"夜",季節:"冬",衣装:"コート＋マフラー",表情:"不安そう",シチュエーション:"何かを探している",距離:"全身",アングル:"少し見下ろす（ハイアングル）",向き:"斜め後ろ"},extra:["遠くの灯り","足音","古い看板"]}
];
function themeGen(){
 const s=themeIn.value.trim();
 if(/魔法|異世界|妖精|ドラゴン|魔王|冒険|魔導|ファンタジー/.test(s))worldMode="fantasy"; if(!s){status.textContent="テーマを入力してね。";return}
 const hits=THEME_BUNDLES.filter(b=>b.keys.some(k=>s.includes(k)));
 let o={}; if(hits.length){hits.forEach(b=>Object.assign(o,b.o))} else {
   if(/春|桜|花見/.test(s))o={季節:"春"};
   if(/夏|海|祭|花火/.test(s))o={季節:"夏"};
   if(/秋|紅葉|月見/.test(s))o={季節:"秋"};
   if(/冬|雪|クリスマス/.test(s))o={季節:"冬"};
   if(/学校|青春/.test(s))o.場所="学校の屋上";
   if(/駅/.test(s))o.場所="駅のホーム";
   if(/海/.test(s))o.場所="海辺";
   if(/雨/.test(s))o.場所="雨上がりの商店街";
 }
 // 明示された条件を最後に優先
 if(/春/.test(s))o.季節="春"; if(/夏/.test(s))o.季節="夏"; if(/秋/.test(s))o.季節="秋"; if(/冬/.test(s))o.季節="冬";
 if(/雨/.test(s))o.天候="雨";
 if(/一人|孤独|寂しい/.test(s))o.シチュエーション="一人で物思いにふけっている";
 current=make(o); current.テーマ=s; current.テーマ補足=hits.flatMap(b=>b.extra).slice(0,3).join("／"); render(); sync(); status.textContent="テーマを中心に生成しました！"
}
function themeRandom(){themeIn.value=pick(["ちょっと寂しい絵","夏の青春","雨の日に一人で帰る感じ","明るくて楽しい絵","ちょっと不安になる雰囲気"]);themeGen()}

const T=["風で髪や服が少し揺れる瞬間にする","遠くに誰かの姿を小さく入れる","足元に落ちた何かに気づく","ふとスマホに通知が届く","背景に季節を感じる小さな出来事を入れる"],O=["古いラジオ","巨大な風船","一輪だけの花","見覚えのない鍵","レトロなカメラ","紙飛行機","小さなトランク","金魚鉢","古い地図","片方だけの手袋"];

function eventGen(){const ev=document.getElementById("event").value,d=E[ev],o={季節:d[0],衣装:d[2],シチュエーション:pick(d[4])};if(D.場所.some(x=>x[0]==d[1]))o.場所=d[1];current=make(o);current.イベント=ev;current.小物=pick(d[3]);render();sync();status.textContent=ev+"を中心に生成しました！"}
function addCustom(){let w=cw.value.trim();if(!w)return;custom.push({word:w,category:cc.value,related:cr.value.split(",").map(x=>x.trim()).filter(Boolean)});localStorage.ideaCustom=JSON.stringify(custom);cw.value="";cr.value="";renderCustom()}
function renderCustom(){document.getElementById("custom").innerHTML=custom.length?custom.map((x,i)=>`<div class="card"><b>${esc(x.word)}</b> <span class="tag">${esc(x.category)}</span><div class="small">${x.related.map(esc).join(" / ")}</div><button class="danger" onclick="custom.splice(${i},1);localStorage.ideaCustom=JSON.stringify(custom);renderCustom()">削除</button></div>`).join(""):"<div class='small'>まだありません。</div>"}
setup();document.getElementById("mr").classList.toggle("active",worldMode==="real");document.getElementById("mf").classList.toggle("active",worldMode==="fantasy");generate();saved();
